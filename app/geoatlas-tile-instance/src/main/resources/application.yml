server:
  port: ${SERVER_PORT:11002}
  # Spring Boot 3.2+原生虚拟线程支持
  tomcat:
    threads:
      # 在虚拟线程环境下，这些值可以设置更高
      max: 1000
      min-spare: 50
    # 启用虚拟线程处理请求
    virtual-threads: true

spring:
  application:
    name: tiles-api-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  # Spring Boot 3.2+原生虚拟线程配置
  threads:
    virtual:
      enabled: true
  
  # 数据库连接池优化（配合虚拟线程）
  datasource:
    hikari:
      # 虚拟线程环境下可以增大连接池
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
  
  # 异步任务配置
  task:
    execution:
      pool:
        # 虚拟线程环境下的配置
        core-size: 20
        max-size: 1000
        queue-capacity: 50000
        keep-alive: 60s
      thread-name-prefix: geo-atlas-virtual-

logging:
  config: classpath:logging.properties
  level:
    org.geoatlas: INFO
    org.springframework: INFO
